
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RISU - Tactical Attendance Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --blueprint-cyan: rgba(34, 211, 238, 0.1);
            --obsidian: #050b18;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--obsidian);
            color: #e2e8f0;
            overflow-x: hidden;
        }
        .font-mono-tech {
            font-family: 'JetBrains Mono', monospace;
        }
        .font-brand {
            font-family: 'Montserrat', sans-serif;
        }
        /* Blueprint Grid Effect */
        .blueprint-bg {
            background-image: 
                linear-gradient(to right, var(--blueprint-cyan) 1px, transparent 1px),
                linear-gradient(to bottom, var(--blueprint-cyan) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .blueprint-bg-fine {
            background-image: 
                linear-gradient(to right, var(--blueprint-cyan) 0.5px, transparent 0.5px),
                linear-gradient(to bottom, var(--blueprint-cyan) 0.5px, transparent 0.5px);
            background-size: 10px 10px;
        }
        .glass-blueprint {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(34, 211, 238, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }
        .cyan-glow {
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.15);
        }
        .primary-gradient {
            background: linear-gradient(135deg, #0891b2 0%, #1e40af 100%);
        }
        /* Scanning Animation */
        .scanline {
            width: 100%;
            height: 2px;
            background: linear-gradient(to bottom, transparent, rgba(34, 211, 238, 0.2), transparent);
            position: fixed;
            top: 0;
            z-index: 1000;
            pointer-events: none;
            animation: scan 8s linear infinite;
        }
        @keyframes scan {
            0% { transform: translateY(-100vh); }
            100% { transform: translateY(100vh); }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div class="scanline"></div>
    <div id="root"></div>
</body>
</html>
